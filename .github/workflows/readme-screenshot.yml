name: Capture README screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install app
        run: npm ci

      - name: Install screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/orbit-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orbit-preview.log
          exit 1

      - name: Capture desktop screenshot
        run: |
          mkdir -p docs/screenshots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'

          const now = '2026-09-28T18:00:00.000Z'
          const tasks = [
            {
              id: 'demo-1',
              title: 'Finish portfolio case study',
              completed: false,
              favorite: true,
              bucket: 'today',
              estimate: 30,
              createdAt: '2026-09-28T08:00:00.000Z',
              updatedAt: now,
            },
            {
              id: 'demo-2',
              title: 'Call Mum after work',
              completed: false,
              favorite: true,
              bucket: 'today',
              estimate: 15,
              createdAt: '2026-09-28T08:05:00.000Z',
              updatedAt: now,
            },
            {
              id: 'demo-3',
              title: 'Book dentist appointment',
              completed: false,
              favorite: true,
              bucket: 'today',
              estimate: 15,
              createdAt: '2026-09-28T08:10:00.000Z',
              updatedAt: now,
            },
            {
              id: 'demo-4',
              title: 'Pick up groceries',
              completed: false,
              favorite: false,
              bucket: 'today',
              estimate: 30,
              createdAt: '2026-09-28T08:15:00.000Z',
              updatedAt: now,
            },
            {
              id: 'demo-5',
              title: 'Plan Saturday breakfast',
              completed: false,
              favorite: false,
              bucket: 'next',
              estimate: 15,
              createdAt: '2026-09-28T08:20:00.000Z',
              updatedAt: now,
            },
          ]

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          })

          await page.emulateMedia({ reducedMotion: 'reduce', colorScheme: 'light' })
          await page.addInitScript(({ tasks, now }) => {
            localStorage.setItem(
              'orbit.tasks.v2',
              JSON.stringify({ version: 2, savedAt: now, tasks }),
            )
          }, { tasks, now })

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
          await page.evaluate(() => window.scrollTo(0, 0))
          await page.screenshot({
            path: 'docs/screenshots/orbit-home.png',
            fullPage: true,
          })

          await browser.close()
          NODE

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/orbit-home.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "docs: add Orbit UI screenshot"
          git push
