name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static quality gate
        run: npm run check

  browser:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned browser verification tooling
        run: |
          npm install --no-save --package-lock=false             @playwright/test@1.63.0             @axe-core/playwright@4.13.0             @lhci/cli@0.15.1

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production app
        run: npm run build

      - name: Run browser and accessibility suite
        run: npx playwright test

      - name: Expose Chromium to Lighthouse
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run Lighthouse budgets
        run: npx lhci autorun --config=./lighthouserc.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orbit-browser-evidence
          path: |
            artifacts/
            .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
